<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#C8893A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="일기장">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>나의 일기장</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#FEF9F0;--surface:#FFFDF8;--card:#FFFFFF;
  --accent:#C8893A;--accent-light:#F5DFB8;--accent-dark:#A06A22;
  --text:#3D2B1F;--text-muted:#8B6E5A;--text-light:#C4A98C;
  --border:#E8DDD0;--border-light:#F0E8DC;--danger:#C0614A;
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:480px;margin:0 auto;overflow-x:hidden;}

/* HEADER */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;min-height:60px;}
.header-left{display:flex;flex-direction:column;gap:2px;}
.header-title{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:600;letter-spacing:-0.3px;}
.header-sub{font-size:11px;color:var(--text-muted);}
.header-actions{display:flex;align-items:center;gap:6px;}
.icon-btn{background:none;border:none;cursor:pointer;font-size:20px;padding:6px;border-radius:8px;color:var(--text);}
.text-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--text-muted);cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.text-btn.danger{border-color:#F0C8C0;color:var(--danger);}

/* LOADING */
.loading-overlay{position:fixed;inset:0;background:rgba(254,249,240,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:500;gap:16px;}
.loading-overlay.hidden{display:none;}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:14px;color:var(--text-muted);}

/* SETUP BANNER */
.setup-banner{margin:16px;padding:20px;background:#FFF8EC;border:1.5px solid #F5DFB8;border-radius:16px;}
.setup-banner h3{font-size:15px;margin-bottom:8px;color:var(--text);}
.setup-banner p{font-size:13px;line-height:1.8;color:var(--text-muted);margin-bottom:12px;}
.setup-input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-family:'Noto Sans KR',sans-serif;outline:none;color:var(--text);background:white;margin-bottom:10px;}
.setup-input:focus{border-color:var(--accent);}
.setup-btn{width:100%;padding:12px;background:var(--accent);color:white;border:none;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}

/* PAGES */
.page{display:none;min-height:calc(100vh - 60px - 64px);}
.page.active{display:block;}

/* SYNC STATUS */
.sync-bar{display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:8px 20px 0;font-size:11px;color:var(--text-muted);}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#ccc;flex-shrink:0;}
.sync-dot.ok{background:#5BAD72;}.sync-dot.syncing{background:var(--accent);animation:pulse 1s infinite;}.sync-dot.err{background:var(--danger);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}

/* CALENDAR */
.cal-wrap{padding:12px 16px 20px;}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.month-arrow{background:none;border:1px solid var(--border);border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:20px;color:var(--text);display:flex;align-items:center;justify-content:center;}
.month-label{font-family:'Noto Serif KR',serif;font-size:20px;font-weight:500;}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:6px;}
.wd{text-align:center;font-size:11px;font-weight:500;color:var(--text-muted);padding:6px 0;}
.wd.sun{color:#C0614A;}.wd.sat{color:#4A7AAC;}
.days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;font-size:14px;position:relative;user-select:none;}
.day:hover:not(.empty){background:var(--accent-light);}
.day.empty{cursor:default;pointer-events:none;}
.day.today{background:var(--accent);color:white;font-weight:600;}
.day.sun:not(.today){color:#C0614A;}.day.sat:not(.today){color:#4A7AAC;}
.day.other-month{color:var(--text-light);}
.day.has-entry:not(.today)::after{content:'';position:absolute;bottom:4px;width:4px;height:4px;background:var(--accent);border-radius:50%;}
.day.today.has-entry::after{background:rgba(255,255,255,0.8);}
.day .mood-dot{position:absolute;top:2px;right:2px;font-size:8px;line-height:1;}

/* LIST */
.list-wrap{padding:12px 16px 20px;}
.list-month-group{margin-bottom:24px;}
.list-month-header{font-size:12px;font-weight:500;color:var(--text-muted);letter-spacing:0.5px;margin-bottom:10px;padding-left:4px;}
.entry-card{background:var(--card);border:1px solid var(--border-light);border-radius:16px;padding:16px;margin-bottom:10px;cursor:pointer;display:flex;align-items:flex-start;gap:12px;}
.entry-card-body{flex:1;min-width:0;}
.entry-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.entry-date-small{font-size:11px;color:var(--text-muted);}
.entry-tags-small{font-size:13px;}
.entry-title-small{font-family:'Noto Serif KR',serif;font-size:15px;font-weight:500;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.entry-preview{font-size:12px;color:var(--text-muted);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.entry-thumb{width:58px;height:58px;border-radius:10px;object-fit:cover;flex-shrink:0;}
.empty-state{text-align:center;padding:64px 20px;}
.empty-icon{font-size:52px;margin-bottom:16px;opacity:0.7;}
.empty-title{font-family:'Noto Serif KR',serif;font-size:16px;color:var(--text-muted);line-height:1.8;}

/* EDITOR */
.editor-wrap{padding:20px 20px 140px;}
.editor-date-label{text-align:center;font-size:12px;color:var(--text-muted);margin-bottom:20px;padding:8px 16px;background:var(--border-light);border-radius:20px;display:block;}
.editor-title-input{font-family:'Noto Serif KR',serif;font-size:22px;font-weight:500;border:none;background:none;width:100%;color:var(--text);outline:none;margin-bottom:16px;}
.editor-title-input::placeholder{color:var(--text-light);}
.section-label{font-size:11px;font-weight:500;color:var(--text-muted);letter-spacing:0.5px;margin-bottom:8px;}
.divider{height:1px;background:var(--border-light);margin:16px 0;}
.tag-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.mood-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 14px;border:1.5px solid var(--border);border-radius:14px;cursor:pointer;background:var(--card);font-size:11px;color:var(--text-muted);font-family:'Noto Sans KR',sans-serif;}
.mood-btn .me{font-size:22px;}
.mood-btn.sel{border-color:var(--accent);background:var(--accent-light);color:var(--accent-dark);font-weight:500;}
.weather-btn{display:flex;align-items:center;gap:5px;padding:7px 14px;border:1.5px solid var(--border);border-radius:20px;cursor:pointer;background:var(--card);font-size:13px;color:var(--text-muted);font-family:'Noto Sans KR',sans-serif;}
.weather-btn.sel{border-color:var(--accent);background:var(--accent-light);color:var(--accent-dark);font-weight:500;}
.editor-body{font-family:'Noto Serif KR',serif;font-size:16px;line-height:1.9;border:none;background:none;width:100%;min-height:220px;resize:none;outline:none;color:var(--text);}
.editor-body::placeholder{color:var(--text-light);}
.photo-add-btn{display:flex;align-items:center;gap:8px;padding:12px 16px;border:1.5px dashed var(--border);border-radius:14px;cursor:pointer;background:none;font-size:13px;color:var(--text-muted);width:100%;margin-top:16px;font-family:'Noto Sans KR',sans-serif;}
.photo-uploading{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);margin-top:10px;}
.photo-preview-wrap{position:relative;margin-top:14px;}
.photo-preview-wrap img{width:100%;border-radius:14px;max-height:260px;object-fit:cover;display:block;}
.photo-del-btn{position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.5);color:white;border:none;border-radius:50%;width:30px;height:30px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

/* SAVE BAR */
.save-bar{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:448px;padding:14px;background:var(--accent);color:white;border:none;border-radius:16px;font-size:15px;font-weight:500;cursor:pointer;box-shadow:0 4px 20px rgba(200,137,58,0.4);font-family:'Noto Sans KR',sans-serif;}
.save-bar:disabled{background:#C4A98C;cursor:not-allowed;box-shadow:none;}

/* VIEW */
.view-header{padding:20px;border-bottom:1px solid var(--border-light);}
.view-tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.view-tag{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--accent-dark);background:var(--accent-light);padding:5px 12px;border-radius:20px;}
.view-title{font-family:'Noto Serif KR',serif;font-size:24px;font-weight:600;margin-bottom:8px;line-height:1.4;}
.view-date{font-size:12px;color:var(--text-muted);}
.view-body{padding:24px 20px;font-family:'Noto Serif KR',serif;font-size:16px;line-height:1.95;color:var(--text);white-space:pre-wrap;word-break:break-word;}
.view-photo-wrap{padding:0 20px 24px;}
.view-photo-wrap img{width:100%;border-radius:16px;max-height:360px;object-fit:cover;display:block;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);border-top:1px solid var(--border);display:flex;padding:8px 0;z-index:200;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;cursor:pointer;background:none;border:none;font-size:10px;color:var(--text-muted);font-family:'Noto Sans KR',sans-serif;}
.nav-btn .ni{font-size:22px;line-height:1;}
.nav-btn.active{color:var(--accent);font-weight:500;}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#3D2B1F;color:white;padding:10px 20px;border-radius:12px;font-size:13px;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <div class="loading-text">일기장을 불러오는 중...</div>
</div>

<div class="header">
  <div class="header-left">
    <div class="header-title" id="hdr-title">🗒️ 나의 일기장</div>
    <div class="header-sub" id="hdr-sub">오늘 하루를 기록해보세요</div>
  </div>
  <div class="header-actions" id="hdr-actions"></div>
</div>

<!-- PAGE: CALENDAR -->
<div class="page active" id="pg-calendar">
  <div class="sync-bar">
    <span class="sync-dot" id="sync-dot"></span>
    <span id="sync-text">로딩 중...</span>
  </div>
  <div class="cal-wrap">
    <div class="month-nav">
      <button class="month-arrow" onclick="changeMonth(-1)">‹</button>
      <div class="month-label" id="month-label"></div>
      <button class="month-arrow" onclick="changeMonth(1)">›</button>
    </div>
    <div class="weekdays">
      <div class="wd sun">일</div><div class="wd">월</div><div class="wd">화</div>
      <div class="wd">수</div><div class="wd">목</div><div class="wd">금</div><div class="wd sat">토</div>
    </div>
    <div class="days-grid" id="days-grid"></div>
  </div>
</div>

<!-- PAGE: LIST -->
<div class="page" id="pg-list">
  <div class="list-wrap" id="list-wrap"></div>
</div>

<!-- PAGE: EDITOR -->
<div class="page" id="pg-editor">
  <div class="editor-wrap">
    <div class="editor-date-label" id="ed-date-label"></div>
    <input class="editor-title-input" type="text" id="ed-title" placeholder="오늘의 제목을 입력하세요" maxlength="50">
    <div class="divider"></div>
    <div class="section-label">기분</div>
    <div class="tag-row" id="mood-row"></div>
    <div class="section-label">날씨</div>
    <div class="tag-row" id="weather-row"></div>
    <div class="divider"></div>
    <textarea class="editor-body" id="ed-body" placeholder="오늘 하루는 어땠나요?&#10;자유롭게 적어보세요 ✍️" rows="10"></textarea>
    <label class="photo-add-btn">
      📷 사진 첨부하기
      <input type="file" accept="image/*" style="display:none" id="photo-input" onchange="handlePhoto(event)">
    </label>
    <div class="photo-uploading" id="photo-uploading" style="display:none">
      <div class="spinner" style="width:16px;height:16px;border-width:2px;"></div> 사진 업로드 중...
    </div>
    <div class="photo-preview-wrap" id="photo-preview" style="display:none">
      <img id="photo-img" src="" alt="첨부사진">
      <button class="photo-del-btn" onclick="removePhoto()">✕</button>
    </div>
  </div>
  <button class="save-bar" id="save-btn" onclick="saveEntry()">💾 저장하기</button>
</div>

<!-- PAGE: VIEW -->
<div class="page" id="pg-view">
  <div class="view-header">
    <div class="view-tag-row" id="vw-tags"></div>
    <div class="view-title" id="vw-title"></div>
    <div class="view-date" id="vw-date"></div>
  </div>
  <div class="view-body" id="vw-body"></div>
  <div class="view-photo-wrap" id="vw-photo" style="display:none">
    <img id="vw-photo-img" src="" alt="일기 사진">
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-btn active" id="nb-cal" onclick="showPage('calendar')"><span class="ni">📅</span>달력</button>
  <button class="nav-btn" id="nb-list" onclick="showPage('list')"><span class="ni">📋</span>목록</button>
  <button class="nav-btn" id="nb-write" onclick="openEditor(null)"><span class="ni">✏️</span>쓰기</button>
</nav>

<div class="toast" id="toast"></div>

<script>
// ★ GAS 배포 URL (최초 1회 입력 후 자동 저장)
let API_URL = localStorage.getItem('diary_api_url') || '';

const MOODS   = [{id:'happy',e:'😊',l:'행복'},{id:'calm',e:'😌',l:'평온'},{id:'normal',e:'😐',l:'보통'},{id:'sad',e:'😢',l:'슬픔'},{id:'angry',e:'😤',l:'화남'},{id:'tired',e:'😴',l:'피곤'}];
const WEATHERS= [{id:'sunny',e:'☀️',l:'맑음'},{id:'cloudy',e:'⛅',l:'흐림'},{id:'rainy',e:'🌧️',l:'비'},{id:'snowy',e:'❄️',l:'눈'}];

let curYear,curMonth,curPage='calendar';
let edDate=null,selMood=null,selWeather=null,curPhoto=null,viewDate=null;
let cache={}, photoUploading=false;
const $=id=>document.getElementById(id);

// ── PWA 서비스워커 등록 ──
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}

// ── API 호출 ──
async function apiGet(params={}){
  const url=new URL(API_URL);
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  const res=await fetch(url.toString(),{redirect:'follow'});
  return res.json();
}
async function apiPost(body){
  const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),redirect:'follow'});
  return res.json();
}

// ── 날짜 유틸 ──
function today(){const d=new Date();return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;}
function p(n){return String(n).padStart(2,'0');}
function fmtDate(s){const[y,m,d]=s.split('-');const dow=['일','월','화','수','목','금','토'];const day=new Date(+y,+m-1,+d).getDay();return `${y}년 ${+m}월 ${+d}일 (${dow[day]})`;}
function fmtShort(s){const[,m,d]=s.split('-');const dow=['일','월','화','수','목','금','토'];const day=new Date(...s.split('-').map((v,i)=>i===1?+v-1:+v)).getDay();return `${+m}월 ${+d}일 (${dow[day]})`;}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}
function setSyncStatus(s,txt){const d=$('sync-dot');if(!d)return;d.className='sync-dot '+s;$('sync-text').textContent=txt;}

// ── API URL 설정 안 됐을 때 배너 ──
function showSetupBanner(){
  const pg=$('pg-calendar');
  if($('setup-banner'))return;
  const b=document.createElement('div');
  b.id='setup-banner';b.className='setup-banner';
  b.innerHTML=`<h3>⚙️ 초기 설정</h3>
    <p>GAS 배포 후 발급된 웹앱 URL을 입력해주세요.<br>한 번만 입력하면 자동 저장됩니다.</p>
    <input class="setup-input" id="api-url-input" type="url" placeholder="https://script.google.com/macros/s/.../exec">
    <button class="setup-btn" onclick="applyApiUrl()">연결하기</button>`;
  pg.insertBefore(b,pg.firstChild);
  $('loading').classList.add('hidden');
}
function applyApiUrl(){
  const val=$('api-url-input').value.trim();
  if(!val.startsWith('https://')){toast('올바른 URL을 입력해주세요');return;}
  API_URL=val;localStorage.setItem('diary_api_url',API_URL);
  $('setup-banner').remove();
  init();
}

// ── 데이터 로드 ──
async function init(){
  $('loading').classList.remove('hidden');
  setSyncStatus('syncing','동기화 중...');
  try{
    const res=await apiGet({action:'getAll'});
    if(res.success){
      cache=res.entries||{};
      setSyncStatus('ok','동기화됨 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}));
    }else{setSyncStatus('err','오류');toast('⚠️ '+res.error);}
  }catch(e){setSyncStatus('err','연결 실패');toast('⚠️ 서버 연결 실패');}
  $('loading').classList.add('hidden');
  renderCalendar();
}

// ━━━━ PAGE ROUTING ━━━━
function showPage(pg){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  $(`pg-${pg}`).classList.add('active');curPage=pg;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const nm={calendar:'nb-cal',list:'nb-list'};if(nm[pg])$(nm[pg]).classList.add('active');
  const T=$('hdr-title'),S=$('hdr-sub'),A=$('hdr-actions');
  if(pg==='calendar'){T.textContent='🗒️ 나의 일기장';S.textContent='오늘 하루를 기록해보세요';A.innerHTML=`<button class="icon-btn" onclick="init()">🔄</button>`;renderCalendar();}
  else if(pg==='list'){T.textContent='📋 전체 일기';S.textContent='나의 모든 기록';A.innerHTML=`<button class="icon-btn" onclick="init()">🔄</button>`;renderList();}
  else if(pg==='editor'){T.textContent='✏️ 일기 쓰기';S.textContent=fmtDate(edDate);A.innerHTML=`<button class="icon-btn" onclick="showPage('calendar')">✕</button>`;}
  else if(pg==='view'){T.textContent='📖 일기 보기';S.textContent=fmtDate(viewDate);A.innerHTML=`<button class="text-btn" onclick="openEditor('${viewDate}')">수정</button><button class="text-btn danger" onclick="deleteEntry('${viewDate}')">삭제</button>`;}
}

// ━━━━ CALENDAR ━━━━
function changeMonth(dir){curMonth+=dir;if(curMonth>11){curMonth=0;curYear++;}if(curMonth<0){curMonth=11;curYear--;}renderCalendar();}
function renderCalendar(){
  const mn=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  $('month-label').textContent=`${curYear}년 ${mn[curMonth]}`;
  const td=today(),grid=$('days-grid');grid.innerHTML='';
  const fd=new Date(curYear,curMonth,1).getDay(),ld=new Date(curYear,curMonth+1,0).getDate(),pl=new Date(curYear,curMonth,0).getDate();
  for(let i=0;i<fd;i++){const el=document.createElement('div');el.className='day empty other-month';el.textContent=pl-fd+1+i;grid.appendChild(el);}
  for(let d=1;d<=ld;d++){
    const ds=`${curYear}-${p(curMonth+1)}-${p(d)}`,dow=new Date(curYear,curMonth,d).getDay();
    const el=document.createElement('div');
    let cls='day';if(ds===td)cls+=' today';if(cache[ds])cls+=' has-entry';if(dow===0)cls+=' sun';if(dow===6)cls+=' sat';
    el.className=cls;el.textContent=d;
    if(cache[ds]&&cache[ds].mood&&ds!==td){const m=MOODS.find(x=>x.id===cache[ds].mood);if(m){const dot=document.createElement('span');dot.className='mood-dot';dot.textContent=m.e;el.appendChild(dot);}}
    el.onclick=()=>cache[ds]?viewEntry(ds):openEditor(ds);
    grid.appendChild(el);
  }
}

// ━━━━ LIST ━━━━
function renderList(){
  const wrap=$('list-wrap'),entries=Object.entries(cache).sort((a,b)=>b[0].localeCompare(a[0]));
  if(!entries.length){wrap.innerHTML=`<div class="empty-state"><div class="empty-icon">📝</div><div class="empty-title">아직 작성된 일기가 없어요.<br>오늘 첫 번째 일기를 써보세요!</div></div>`;return;}
  const groups={};
  entries.forEach(([ds,e])=>{const ym=ds.substring(0,7);if(!groups[ym])groups[ym]=[];groups[ym].push([ds,e]);});
  wrap.innerHTML=Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0])).map(([ym,list])=>{
    const[y,m]=ym.split('-');
    const cards=list.map(([ds,e])=>{
      const mood=e.mood?MOODS.find(x=>x.id===e.mood):null,wx=e.weather?WEATHERS.find(x=>x.id===e.weather):null;
      const prev=(e.content||'').substring(0,80).replace(/\n/g,' ');
      const thumb=e.photoUrl?`<img class="entry-thumb" src="${esc(e.photoUrl)}" alt="" loading="lazy">`:'';
      return `<div class="entry-card" onclick="viewEntry('${ds}')"><div class="entry-card-body"><div class="entry-card-top"><div class="entry-date-small">${fmtShort(ds)}</div><div class="entry-tags-small">${wx?wx.e:''}${mood?mood.e:''}</div></div><div class="entry-title-small">${esc(e.title||'제목 없음')}</div>${prev?`<div class="entry-preview">${esc(prev)}${(e.content||'').length>80?'…':''}</div>`:''}</div>${thumb}</div>`;
    }).join('');
    return `<div class="list-month-group"><div class="list-month-header">${y}년 ${+m}월 · ${list.length}개</div>${cards}</div>`;
  }).join('');
}

// ━━━━ EDITOR ━━━━
function openEditor(ds){
  edDate=ds||today();selMood=null;selWeather=null;curPhoto=null;
  const e=cache[edDate];
  $('ed-date-label').textContent=fmtDate(edDate);$('ed-title').value=e?e.title:'';$('ed-body').value=e?e.content:'';
  if(e){selMood=e.mood||null;selWeather=e.weather||null;curPhoto=e.photoUrl||null;}
  buildMoodRow();buildWeatherRow();
  if(curPhoto){$('photo-img').src=curPhoto;$('photo-preview').style.display='block';}else $('photo-preview').style.display='none';
  $('photo-input').value='';$('save-btn').disabled=false;$('save-btn').textContent='💾 저장하기';
  showPage('editor');setTimeout(()=>$('ed-title').focus(),100);
}
function buildMoodRow(){$('mood-row').innerHTML=MOODS.map(m=>`<button class="mood-btn${selMood===m.id?' sel':''}" onclick="selMood='${m.id}';buildMoodRow()"><span class="me">${m.e}</span>${m.l}</button>`).join('');}
function buildWeatherRow(){$('weather-row').innerHTML=WEATHERS.map(w=>`<button class="weather-btn${selWeather===w.id?' sel':''}" onclick="selWeather='${w.id}';buildWeatherRow()">${w.e} ${w.l}</button>`).join('');}

function handlePhoto(ev){
  const file=ev.target.files[0];if(!file)return;
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=async()=>{
    URL.revokeObjectURL(url);
    const maxW=1000;let w=img.width,h=img.height;
    if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    const base64=c.toDataURL('image/jpeg',0.75);
    $('photo-uploading').style.display='flex';$('save-btn').disabled=true;photoUploading=true;
    try{
      const res=await apiPost({action:'uploadPhoto',date:edDate,photo:base64});
      if(res.success){curPhoto=res.url;$('photo-img').src=curPhoto;$('photo-preview').style.display='block';toast('📷 사진 업로드 완료!');}
      else toast('⚠️ 사진 업로드 실패');
    }catch(e){toast('⚠️ 사진 업로드 오류');}
    $('photo-uploading').style.display='none';$('save-btn').disabled=false;photoUploading=false;
  };img.src=url;
}
function removePhoto(){curPhoto=null;$('photo-preview').style.display='none';}

async function saveEntry(){
  if(photoUploading){toast('사진 업로드 완료 후 저장해주세요');return;}
  const title=$('ed-title').value.trim(),content=$('ed-body').value.trim();
  if(!title&&!content){toast('제목이나 내용을 입력해주세요 ✍️');return;}
  $('save-btn').disabled=true;$('save-btn').textContent='저장 중...';setSyncStatus('syncing','저장 중...');
  const entry={date:edDate,title:title||'제목 없음',content,mood:selMood,weather:selWeather,photoUrl:curPhoto};
  try{
    const res=await apiPost({action:'save',entry});
    if(res.success){cache[edDate]=entry;toast('✅ 저장되었습니다');setSyncStatus('ok','저장됨');showPage('calendar');}
    else{toast('⚠️ 저장 실패: '+(res.error||''));setSyncStatus('err','저장 실패');$('save-btn').disabled=false;$('save-btn').textContent='💾 저장하기';}
  }catch(e){toast('⚠️ 서버 오류');setSyncStatus('err','오류');$('save-btn').disabled=false;$('save-btn').textContent='💾 저장하기';}
}

// ━━━━ VIEW ━━━━
function viewEntry(ds){
  const e=cache[ds];if(!e)return;viewDate=ds;
  const tags=$('vw-tags');tags.innerHTML='';
  if(e.mood){const m=MOODS.find(x=>x.id===e.mood);if(m)tags.innerHTML+=`<span class="view-tag">${m.e} ${m.l}</span>`;}
  if(e.weather){const w=WEATHERS.find(x=>x.id===e.weather);if(w)tags.innerHTML+=`<span class="view-tag">${w.e} ${w.l}</span>`;}
  $('vw-title').textContent=e.title||'제목 없음';$('vw-date').textContent=fmtDate(ds);$('vw-body').textContent=e.content||'';
  if(e.photoUrl){$('vw-photo-img').src=e.photoUrl;$('vw-photo').style.display='block';}else $('vw-photo').style.display='none';
  showPage('view');
}
async function deleteEntry(ds){
  if(!confirm('이 일기를 삭제할까요?'))return;
  setSyncStatus('syncing','삭제 중...');
  try{
    const res=await apiPost({action:'delete',date:ds});
    if(res.success){delete cache[ds];toast('🗑️ 삭제되었습니다');setSyncStatus('ok','동기화됨');showPage('calendar');}
    else{toast('⚠️ 삭제 실패');setSyncStatus('err','실패');}
  }catch(e){toast('⚠️ 서버 오류');setSyncStatus('err','오류');}
}

// ━━━━ INIT ━━━━
const now=new Date();curYear=now.getFullYear();curMonth=now.getMonth();
if(!API_URL||!API_URL.startsWith('https://')){showSetupBanner();renderCalendar();}
else init();
</script>
