  }
  header{padding:calc(24px + env(safe-area-inset-top)) 4px 16px;}
  header h1{margin:0; font-size:22px; font-weight:800; letter-spacing:-0.03em;}
  header p{margin:4px 0 0; font-size:14px; color:var(--sub); font-weight:500;}
  .card{background:var(--card); border-radius:20px; padding:20px; margin-bottom:12px;}
  .card h2{margin:0 0 16px; font-size:17px; font-weight:700; letter-spacing:-0.02em;}
  .label{font-size:14px; color:var(--sub); font-weight:600;}

  .big{display:flex; align-items:baseline; gap:4px; margin:6px 0 18px;}
  .big b{font-size:46px; font-weight:800; letter-spacing:-0.04em; line-height:1.1;}
  .big span{font-size:20px; font-weight:700; color:var(--sub);}

  .chips{display:flex; gap:8px;}
  .chip{flex:1; background:var(--fill); border-radius:14px; padding:12px 10px; text-align:center;}
  .chip em{display:block; font-style:normal; font-size:12px; color:var(--sub); font-weight:600; margin-bottom:4px;}
  .chip b{font-size:16px; font-weight:700; letter-spacing:-0.02em;}
  .up{color:var(--red);} .down{color:var(--blue);}

  .bar{height:8px; background:#E5E8EB; border-radius:999px; margin-top:18px; overflow:hidden;}
  .bar i{display:block; height:100%; background:var(--blue); border-radius:999px; transition:width .4s ease;}
  .barfoot{display:flex; justify-content:space-between; margin-top:8px; font-size:12px; color:var(--sub); font-weight:600;}

  .row{display:flex; gap:8px;}
  input[type=number]{
    flex:1; height:54px; border:none; background:var(--fill); border-radius:14px;
    padding:0 16px; font-size:20px; font-weight:700; color:var(--text);
    font-family:inherit; letter-spacing:-0.02em; min-width:0;
  }
  input[type=number]::placeholder{color:var(--gray); font-weight:700;}
  input:focus{outline:2px solid var(--blue); outline-offset:-2px;}
  button.primary{
    height:54px; padding:0 22px; border:none; border-radius:14px;
    background:var(--blue); color:#fff; font-size:16px; font-weight:700;
    font-family:inherit; letter-spacing:-0.02em; flex:none;
  }
  button.primary:active{background:#1B64DA;}

  .chart{margin-top:18px;}
  .chart svg{display:block; width:100%; height:auto;}
  .empty{padding:28px 0; text-align:center; font-size:14px; color:var(--sub); font-weight:500;}

  ul.tasks{list-style:none; margin:0; padding:0;}
  ul.tasks li{display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid var(--line);}
  ul.tasks li:last-child{border-bottom:none; padding-bottom:0;}
  ul.tasks li:first-child{padding-top:0;}
  .box{
    width:26px; height:26px; flex:none; border-radius:50%;
    border:2px solid var(--gray); background:#fff;
    display:flex; align-items:center; justify-content:center; transition:.15s;
  }
  .box svg{width:14px; height:14px; opacity:0;}
  li.on .box{background:var(--blue); border-color:var(--blue);}
  li.on .box svg{opacity:1;}
  ul.tasks p{margin:0; font-size:16px; font-weight:600; letter-spacing:-0.02em;}
  li.on p{color:var(--sub);}

  .week{display:flex; gap:6px; align-items:flex-end;}
  .day{flex:1; text-align:center;}
  .track{height:80px; background:var(--fill); border-radius:8px; display:flex; align-items:flex-end; overflow:hidden;}
  .track i{display:block; width:100%; background:var(--blue); border-radius:8px; transition:height .4s ease;}
  .day em{display:block; font-style:normal; font-size:12px; color:var(--sub); font-weight:600; margin-top:8px;}
  .day.today em{color:var(--blue); font-weight:800;}

  .tennis{display:flex; align-items:center; justify-content:space-between; margin-top:20px; padding-top:18px; border-top:1px solid var(--line);}
  .tennis p{margin:0; font-size:16px; font-weight:600;}
  .dots{display:flex; align-items:center; gap:8px;}
  .dots span{width:10px; height:10px; border-radius:50%; background:#E5E8EB;}
  .dots span.on{background:var(--blue);}
  .dots b{font-size:15px; font-weight:700; margin-left:2px;}

  .quit{background:var(--fill); border-radius:14px; padding:16px; margin-bottom:8px;}
  .quit:last-child{margin-bottom:0;}
  .qhead{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .qname{font-size:14px; color:var(--sub); font-weight:600;}
  .qday{display:flex; align-items:baseline; gap:3px; margin-top:2px;}
  .qday b{font-size:30px; font-weight:800; letter-spacing:-0.04em; line-height:1.15;}
  .qday span{font-size:15px; font-weight:700; color:var(--sub);}
  .qsub{margin:10px 0 0; font-size:13px; color:var(--sub); font-weight:500;}
  .datebtn{
    position:relative; display:inline-flex; align-items:center; justify-content:center;
    height:38px; padding:0 14px; border:1px solid #E5E8EB; border-radius:10px;
    background:#fff; color:#4E5968; font-size:14px; font-weight:700; flex:none;
  }
  .datebtn:active{background:#F2F4F6;}
  .datebtn input{
    position:absolute; left:0; top:0; width:100%; height:100%;
    opacity:0; margin:0; padding:0; border:none; background:none;
    -webkit-appearance:none; appearance:none;
  }

  .hint{margin:-6px 0 16px; font-size:13px; color:var(--sub); font-weight:500; line-height:1.55;}
  button.primary.wide{flex:1; padding:0;}
  .ghost{
    position:relative; display:inline-flex; align-items:center; justify-content:center;
    height:54px; padding:0 20px; border:1px solid #E5E8EB; border-radius:14px;
    background:#fff; color:#4E5968; font-size:16px; font-weight:700;
    font-family:inherit; flex:none;
  }
  .ghost:active{background:#F7F8FA;}
  .ghost input{
    position:absolute; left:0; top:0; width:100%; height:100%;
    opacity:0; margin:0; padding:0; border:none; background:none;
    -webkit-appearance:none; appearance:none;
  }

  #toast{
    position:fixed; left:50%; bottom:calc(28px + env(safe-area-inset-bottom));
    transform:translate(-50%,12px); background:rgba(25,31,40,.92); color:#fff;
    padding:13px 20px; border-radius:14px; font-size:15px; font-weight:600;
    opacity:0; pointer-events:none; transition:.25s; white-space:nowrap;
  }
  #toast.show{opacity:1; transform:translate(-50%,0);}
</style>
</head>
<body>

<header>
  <h1>63 프로젝트</h1>
  <p id="today"></p>
</header>

<section class="card">
  <div class="label">현재 체중</div>
  <div class="big"><b id="cur">-</b><span>kg</span></div>
  <div class="chips">
    <div class="chip"><em>목표까지</em><b id="toGoal">-</b></div>
    <div class="chip"><em>시작 후</em><b id="fromStart">-</b></div>
    <div class="chip"><em>직전 기록 대비</em><b id="fromPrev">-</b></div>
  </div>
  <div class="bar"><i id="prog" style="width:0%"></i></div>
  <div class="barfoot"><span id="startLabel">72.0kg</span><span>63.0kg</span></div>
</section>

<section class="card">
  <h2>체중 기록</h2>
  <div class="row">
    <input type="number" id="input" inputmode="decimal" step="0.1" placeholder="72.0">
    <button class="primary" id="save">기록</button>
  </div>
  <div class="chart" id="chart"></div>
</section>

<section class="card">
  <h2>끊는 중</h2>
  <div id="quits"></div>
</section>

<section class="card">
  <h2>오늘 할 일</h2>
  <ul class="tasks" id="tasks"></ul>
</section>

<section class="card">
  <h2>이번 주</h2>
  <div class="week" id="week"></div>
  <div class="tennis">
    <p>테니스 주 3회</p>
    <div class="dots" id="tennis"></div>
  </div>
</section>

<section class="card">
  <h2>기록 백업</h2>
  <p class="hint">기록은 이 폰 안에만 저장돼요. 가끔 파일로 내보내 두면 폰을 바꾸거나 기록이 지워져도 그대로 되살릴 수 있어요.</p>
  <div class="row">
    <button class="primary wide" id="export">파일로 내보내기</button>
    <label class="ghost"><span>불러오기</span>
      <input type="file" id="importFile" accept="application/json,.json">
    </label>
  </div>
  <p class="qsub" id="backupInfo"></p>
</section>

<div id="toast"></div>

<script>
(function(){
  var KEY='diet63.v1', START=72.0, GOAL=63.0;
  var TASKS=[
    {k:'am',    t:'아침 단백질 쉐이크'},
    {k:'step',  t:'스텝퍼 40분'},
    {k:'lunch', t:'점심 일반식'},
    {k:'ten',   t:'테니스 (주 3회)'},
    {k:'pm',    t:'저녁 단백질 쉐이크'},
    {k:'ex',    t:'푸쉬업 + 스쿼트·플랭크'}
  ];
  var DAYNAME=['월','화','수','목','금','토','일'];
  var QUITS=[
    {k:'coffee',  t:'커피', o:'커피를'},
    {k:'alcohol', t:'술',   o:'술을'}
  ];


  var db={weights:{},checks:{},streaks:{},lastBackup:''};
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){
      var p=JSON.parse(raw);
      db.weights=p.weights||{};
      db.checks=p.checks||{};
      db.streaks=p.streaks||{};
      db.lastBackup=p.lastBackup||'';
    }
  }catch(e){}
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(db)); }catch(e){} }

  function pad(n){ return (n<10?'0':'')+n; }
  function key(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function toDate(s){ var a=s.split('-'); return new Date(+a[0],+a[1]-1,+a[2]); }
  var TODAY=key(new Date());

  function signed(v){
    var s=Math.abs(v).toFixed(1);
    if(v>0.049) return '+'+s+'kg';
    if(v<-0.049) return '-'+s+'kg';
    return '0.0kg';
  }
  function tone(el,v){
    el.className = v>0.049 ? 'up' : (v<-0.049 ? 'down' : '');
  }
  function sortedDates(){ return Object.keys(db.weights).sort(); }

  var toastTimer;
  function toast(msg){
    var t=document.getElementById('toast');
    t.textContent=msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){ t.classList.remove('show'); },1800);
  }

  function renderHeader(){
    var d=new Date();
    document.getElementById('today').textContent =
      (d.getMonth()+1)+'월 '+d.getDate()+'일 '+DAYNAME[(d.getDay()+6)%7]+'요일';
  }

  function renderSummary(){
    var ds=sortedDates();
    var start = ds.length ? db.weights[ds[0]] : START;
    var cur   = ds.length ? db.weights[ds[ds.length-1]] : START;
    var prev  = ds.length>1 ? db.weights[ds[ds.length-2]] : null;

    document.getElementById('cur').textContent = cur.toFixed(1);
    document.getElementById('startLabel').textContent = start.toFixed(1)+'kg';

    var g=document.getElementById('toGoal');
    var left = cur-GOAL;
    g.textContent = left>0.049 ? left.toFixed(1)+'kg' : '달성!';
    g.className='';

    var f=document.getElementById('fromStart');
    f.textContent=signed(cur-start); tone(f,cur-start);

    var p=document.getElementById('fromPrev');
    if(prev===null){ p.textContent='-'; p.className=''; }
    else { p.textContent=signed(cur-prev); tone(p,cur-prev); }

    var span=start-GOAL;
    var ratio = span>0 ? (start-cur)/span : (cur<=GOAL?1:0);
    ratio=Math.max(0,Math.min(1,ratio));
    document.getElementById('prog').style.width=(ratio*100).toFixed(1)+'%';

    document.getElementById('input').placeholder=cur.toFixed(1);
  }

  function renderChart(){
    var box=document.getElementById('chart');
    var ds=sortedDates();
    if(ds.length<2){
      box.innerHTML='<div class="empty">기록이 2개 이상 쌓이면<br>그래프가 나타나요</div>';
      return;
    }
    ds=ds.slice(-14);
    var vals=ds.map(function(d){ return db.weights[d]; });
    var W=340,H=170,L=14,R=14,T=22,B=28;
    var lo=Math.min.apply(null,vals.concat([GOAL]))-0.5;
    var hi=Math.max.apply(null,vals.concat([GOAL]))+0.5;
    if(hi-lo<1){ hi=lo+1; }
    function X(i){ return L + (W-L-R) * (ds.length===1?0.5:i/(ds.length-1)); }
    function Y(v){ return T + (H-T-B) * (hi-v)/(hi-lo); }

    var pts=vals.map(function(v,i){ return X(i).toFixed(1)+','+Y(v).toFixed(1); }).join(' ');
    var area='M'+X(0).toFixed(1)+','+(H-B)+' L'+vals.map(function(v,i){
      return X(i).toFixed(1)+','+Y(v).toFixed(1); }).join(' L')+' L'+X(ds.length-1).toFixed(1)+','+(H-B)+' Z';
    var gy=Y(GOAL).toFixed(1);
    var last=ds.length-1;

    function md(s){ var d=toDate(s); return (d.getMonth()+1)+'/'+d.getDate(); }

    var dots=vals.map(function(v,i){
      if(i===last) return '';
      return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="3" fill="#3182F6"/>';
    }).join('');

    box.innerHTML =
      '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+
      '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" stop-color="#3182F6" stop-opacity=".18"/>'+
      '<stop offset="100%" stop-color="#3182F6" stop-opacity="0"/>'+
      '</linearGradient></defs>'+
      '<path d="'+area+'" fill="url(#g)"/>'+
      '<line x1="'+L+'" y1="'+gy+'" x2="'+(W-R)+'" y2="'+gy+'" stroke="#D1D6DB" stroke-width="1.5" stroke-dasharray="4 4"/>'+
      '<text x="'+(W-R)+'" y="'+(gy-7)+'" text-anchor="end" font-size="11" font-weight="700" fill="#8B95A1">목표 63kg</text>'+
      '<polyline points="'+pts+'" fill="none" stroke="#3182F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+
      dots+
      '<circle cx="'+X(last).toFixed(1)+'" cy="'+Y(vals[last]).toFixed(1)+'" r="6" fill="#fff" stroke="#3182F6" stroke-width="3"/>'+
      '<text x="'+X(last).toFixed(1)+'" y="'+(Y(vals[last])-13).toFixed(1)+'" text-anchor="end" font-size="12" font-weight="800" fill="#191F28">'+vals[last].toFixed(1)+'</text>'+
      '<text x="'+L+'" y="'+(H-8)+'" font-size="11" font-weight="600" fill="#8B95A1">'+md(ds[0])+'</text>'+
      '<text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end" font-size="11" font-weight="600" fill="#8B95A1">'+md(ds[last])+'</text>'+
      '</svg>';
  }

  function renderTasks(){
    var c=db.checks[TODAY]||{};
    var ul=document.getElementById('tasks');
    ul.innerHTML=TASKS.map(function(t){
      return '<li data-k="'+t.k+'" class="'+(c[t.k]?'on':'')+'">'+
        '<span class="box"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5.5 5.5L20 7" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'+
        '<p>'+t.t+'</p></li>';
    }).join('');
  }

  function weekDays(){
    var t=new Date(), wd=(t.getDay()+6)%7;
    var out=[];
    for(var i=0;i<7;i++){
      out.push(new Date(t.getFullYear(),t.getMonth(),t.getDate()-wd+i));
    }
    return out;
  }

  function renderWeek(){
    var days=weekDays();
    document.getElementById('week').innerHTML=days.map(function(d,i){
      var k=key(d), c=db.checks[k]||{}, n=0;
      TASKS.forEach(function(t){ if(c[t.k]) n++; });
      var h=Math.round(n/TASKS.length*100);
      return '<div class="day'+(k===TODAY?' today':'')+'">'+
        '<div class="track"><i style="height:'+h+'%"></i></div>'+
        '<em>'+DAYNAME[i]+'</em></div>';
    }).join('');

    var cnt=0;
    days.forEach(function(d){ var c=db.checks[key(d)]||{}; if(c.ten) cnt++; });
    var dots='';
    for(var i=0;i<3;i++) dots+='<span class="'+(i<cnt?'on':'')+'"></span>';
    document.getElementById('tennis').innerHTML=dots+'<b>'+cnt+' / 3회</b>';
  }

  // 끊기 시작일이 없으면 앱을 처음 연 날을 시작일로 잡는다
  (function(){
    var changed=false;
    QUITS.forEach(function(q){
      if(!db.streaks[q.k] || !db.streaks[q.k].start){
        db.streaks[q.k]={start:TODAY};
        changed=true;
      }
    });
    if(changed) save();
  })();

  function daysSince(s){
    return Math.floor((toDate(TODAY)-toDate(s))/86400000)+1;
  }

  function renderQuits(){
    document.getElementById('quits').innerHTML=QUITS.map(function(q){
      var st=db.streaks[q.k], n=daysSince(st.start), d=toDate(st.start);
      return '<div class="quit">'+
        '<div class="qhead">'+
          '<div>'+
            '<div class="qname">'+q.t+' 끊은 지</div>'+
            '<div class="qday"><b>'+n+'</b><span>일째</span></div>'+
          '</div>'+
          '<label class="datebtn"><span>날짜 수정</span>'+
            '<input type="date" data-q="'+q.k+'" value="'+st.start+'" max="'+TODAY+'">'+
          '</label>'+
        '</div>'+
        '<p class="qsub">'+(d.getMonth()+1)+'월 '+d.getDate()+'일부터</p>'+
      '</div>';
    }).join('');
  }

  document.getElementById('quits').addEventListener('change',function(e){
    var el=e.target;
    if(el.tagName!=='INPUT' || el.type!=='date') return;
    var k=el.dataset.q, v=el.value;
    if(!v || !db.streaks[k]){ renderQuits(); return; }
    if(v>TODAY) v=TODAY;            // 오늘보다 뒤는 고를 수 없다
    db.streaks[k].start=v;
    save(); renderQuits();
    var q=null;
    QUITS.forEach(function(x){ if(x.k===k) q=x; });
    toast((q?q.t:'')+' 시작일을 바꿨어요');
  });

  var DATE_RE=/^\d{4}-\d{2}-\d{2}$/;

  function renderBackup(){
    var el=document.getElementById('backupInfo');
    if(db.lastBackup && DATE_RE.test(db.lastBackup)){
      var d=toDate(db.lastBackup);
      el.textContent='마지막 백업 '+(d.getMonth()+1)+'월 '+d.getDate()+'일';
    }else{
      el.textContent='아직 백업한 적이 없어요';
    }
  }

  function markBackup(){
    db.lastBackup=TODAY; save(); renderBackup();
    toast('백업 파일을 내보냈어요');
  }

  function downloadBackup(text,name){
    try{
      var url=URL.createObjectURL(new Blob([text],{type:'application/json'}));
      var a=document.createElement('a');
      a.href=url; a.download=name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); },1000);
      markBackup();
    }catch(err){
      toast('내보내기에 실패했어요');
    }
  }

  document.getElementById('export').addEventListener('click',function(){
    var text=JSON.stringify(db,null,2);
    var name='63-project-backup-'+TODAY+'.json';
    var file=null;
    try{ file=new File([text],name,{type:'application/json'}); }catch(err){}
    // 아이폰에서는 공유 시트로 '파일에 저장'이 가장 확실하다
    if(file && navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file]}).then(markBackup).catch(function(err){
        if(err && err.name==='AbortError') return;   // 사용자가 취소한 경우
        downloadBackup(text,name);
      });
      return;
    }
    downloadBackup(text,name);
  });

  document.getElementById('importFile').addEventListener('change',function(e){
    var input=e.target, f=input.files && input.files[0];
    if(!f) return;
    var r=new FileReader();
    r.onerror=function(){ toast('파일을 읽지 못했어요'); input.value=''; };
    r.onload=function(){
      var p=null;
      try{ p=JSON.parse(r.result); }catch(err){}
      if(!p || typeof p!=='object' || (!p.weights && !p.checks && !p.streaks)){
        toast('63 프로젝트 백업 파일이 아니에요'); input.value=''; return;
      }
      var W=p.weights||{}, C=p.checks||{}, S=p.streaks||{};
      var nw=0, nc=0, k;
      for(k in W){ if(DATE_RE.test(k) && !isNaN(parseFloat(W[k]))) nw++; }
      for(k in C){ if(DATE_RE.test(k) && C[k] && typeof C[k]==='object') nc++; }
      if(!nw && !nc){ toast('불러올 기록이 없어요'); input.value=''; return; }
      if(!confirm('체중 기록 '+nw+'개, 체크 '+nc+'일치가 들어있어요.\n지금 기록에 합칠까요?')){
        input.value=''; return;
      }
      for(k in W){
        var v=parseFloat(W[k]);
        if(DATE_RE.test(k) && !isNaN(v)) db.weights[k]=Math.round(v*10)/10;
      }
      for(k in C){
        if(!DATE_RE.test(k) || !C[k] || typeof C[k]!=='object') continue;
        var src=C[k], dst=db.checks[k]||{}, t;
        for(t in src){ if(src[t]) dst[t]=true; }
        db.checks[k]=dst;
      }
      QUITS.forEach(function(q){
        var st=S[q.k];
        if(st && DATE_RE.test(st.start)) db.streaks[q.k]={start:st.start};
      });
      save(); renderAll();
      toast('기록을 불러왔어요');
      input.value='';
    };
    r.readAsText(f);
  });

  function renderAll(){ renderHeader(); renderSummary(); renderChart(); renderQuits(); renderTasks(); renderWeek(); renderBackup(); }

  document.getElementById('save').addEventListener('click',function(){
    var el=document.getElementById('input');
    var v=parseFloat(el.value);
    if(isNaN(v)||v<30||v>200){ toast('체중을 정확히 입력해 주세요'); return; }
    db.weights[TODAY]=Math.round(v*10)/10;
    save(); el.value=''; el.blur();
    renderAll();
    toast('오늘 체중을 기록했어요');
  });

  document.getElementById('input').addEventListener('keydown',function(e){
    if(e.key==='Enter') document.getElementById('save').click();
  });

  document.getElementById('tasks').addEventListener('click',function(e){
    var li=e.target.closest('li'); if(!li) return;
    var k=li.dataset.k;
    if(!db.checks[TODAY]) db.checks[TODAY]={};
    db.checks[TODAY][k]=!db.checks[TODAY][k];
    if(!db.checks[TODAY][k]) delete db.checks[TODAY][k];
    save();
    li.classList.toggle('on');
    renderWeek();
  });

  renderAll();
})();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
</body>
